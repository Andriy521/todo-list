{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center">
                    <h1 class="mb-4 text-danger"><strong>Delete task?</strong></h1>
                    <p class="mb-4 text-muted">Are you sure you want to delete this task? This action cannot be undone.</p>
                    <form action="" method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg me-3">Yes, Delete</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
