{% extends "base.html" %}

{% block content %}
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><strong>Tags list</strong></h1>
            <a href="{% url 'tag-create' %}" class="btn btn-success">Add tag</a>
        </div>

        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Update</th>
                <th scope="col">Delete</th>
            </tr>
            </thead>
            <tbody>
            {% for tag in tags %}
                <tr>
                    <td>{{ tag }}</td>
                    <td><a href="{% url 'tag-update' tag.pk %}" class="btn btn-warning">Update</a></td>
                    <td><a href="{% url 'tag-delete' tag.pk %}" class="btn btn-danger">Delete</a></td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
